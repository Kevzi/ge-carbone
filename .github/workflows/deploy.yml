name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/ge-carbone
            
            # Si le dossier n'est pas encore un dépôt Git, on l'initialise
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/Kevzi/ge-carbone.git
              git fetch --all
              git reset --hard origin/main
            else
              git fetch --all
              git reset --hard origin/main
            fi
            
            # Reconstruction et redémarrage des conteneurs
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Application des migrations Django
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate_schemas
            
            # Mise à jour des facteurs d'émission pour tous les cabinets
            docker compose -f docker-compose.prod.yml exec -T backend python seed_factors.py || true
            
            # Créer/réinitialiser le compte admin
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py ensure_admin || true
            
            # Print DB logs for debugging recovery mode
            docker compose -f docker-compose.prod.yml logs db --tail 100

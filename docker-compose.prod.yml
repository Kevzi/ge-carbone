version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgercarbon_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-ledgercarbon}
      POSTGRES_USER: ${DB_USER:-ledgercarbon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ledgercarbon_redis_prod
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped

  backend:
    build: 
      context: ./src
      dockerfile: Dockerfile
    container_name: ledgercarbon_backend_prod
    depends_on:
      - postgres
      - redis
    env_file:
      - ./src/.env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-ledgercarbon}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-ledgercarbon}
      - DB_HOST=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=ledgercarbon.settings.development
    volumes:
      - media_data_prod:/app/media
    restart: unless-stopped

  celery:
    build: 
      context: ./src
      dockerfile: Dockerfile
    container_name: ledgercarbon_celery_prod
    command: celery -A ledgercarbon worker -l info
    depends_on:
      - postgres
      - redis
      - backend
    env_file:
      - ./src/.env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-ledgercarbon}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-ledgercarbon}
      - DB_HOST=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=ledgercarbon.settings.development
    volumes:
      - media_data_prod:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledgercarbon_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_data_prod:

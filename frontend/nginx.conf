server {
    listen 80;
    server_name ledgercarbon.org www.ledgercarbon.org localhost;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ledgercarbon.org www.ledgercarbon.org localhost;

    ssl_certificate /etc/letsencrypt/live/ledgercarbon.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledgercarbon.org/privkey.pem;

    client_max_body_size 100M;

    # React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers Django API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy vers Django Admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques Django (admin, rest_framework, drf_spectacular)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}

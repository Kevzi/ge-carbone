services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgercarbon_postgres
    environment:
      POSTGRES_DB: ledgercarbon
      POSTGRES_USER: ledgercarbon
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ledgercarbon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optionnel: pour développement avec hot-reload Django

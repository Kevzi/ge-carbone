  #     - postgres
  #     - redis
  #   env_file:
  #     - .env

  # Celery worker
  # celery:
  #   build: .
  #   command: celery -A ledgercarbon worker -l info
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     - postgres
  #     - redis
